name: Sync upstream and publish Prompt Enhance build

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream ref to synchronize (tag, branch, or SHA)"
        required: false
        default: "main"

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: BytePioneer-AI/codex-host

jobs:
  sync:
    if: github.repository == 'floating-life/codex-host'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure upstream
        run: git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"

      - name: Find upstream release
        id: upstream
        shell: bash
        run: |
          git fetch upstream --tags --prune
          ref="${{ inputs.upstream_ref || 'main' }}"
          if git rev-parse --verify "refs/tags/${ref}" >/dev/null 2>&1; then
            commit="$(git rev-list -n 1 "refs/tags/${ref}")"
          else
            git fetch upstream "${ref}"
            commit="$(git rev-parse "FETCH_HEAD")"
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"

      - name: Synchronize upstream into feature branch
        shell: bash
        run: |
          git fetch origin feat/native-prompt-enhance
          git checkout feat/native-prompt-enhance
          git merge --no-edit "${{ steps.upstream.outputs.commit }}"

      - name: Validate Prompt Enhance source
        run: node scripts/release/verify-prompt-enhance-bundle.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: |
          npm run typecheck
          npm run build:typescript
          npm run build:renderer
          npx vitest run --config tests/vitest.config.js packages/host-runtime/test/prompt-enhance.test.ts packages/renderer-extension/test/renderer-enhancement-client.test.ts packages/renderer-extension/test/renderer-prompt-enhance.test.ts packages/renderer-extension/test/renderer-prompt-enhance-editor.test.ts
          node packages/host-runtime/scripts/build-release.mjs --output build/host-runtime.mjs
          node scripts/release/verify-prompt-enhance-bundle.mjs
          rg -q "PromptEnhanceService" build/host-runtime.mjs
          rg -q "installPromptEnhance" packages/renderer-extension/dist/production.js

      - name: Commit synchronized source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: sync upstream ${{ steps.upstream.outputs.ref }}"
          git push origin HEAD:feat/native-prompt-enhance

      - name: Create source tag
        shell: bash
        run: |
          version="$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('package.json', 'utf8')).version)")"
          tag="v${version}-prompt-enhance.${GITHUB_RUN_NUMBER}"
          git tag -a "$tag" -m "CodexHost $tag with native Prompt Enhance"
          git push origin "$tag"
